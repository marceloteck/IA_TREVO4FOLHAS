<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Trevo4Folhas</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="login">
    <header>
      <div class="container navbar">
        <div class="logo">Trevo4Folhas</div>
        <nav>
          <a href="index.html" data-nav="home">Início</a>
          <a href="login.html" class="active" data-nav="login">Login</a>
          <a href="register.html" data-nav="register">Criar conta</a>
        </nav>
        <a class="btn btn-outline" href="register.html">Criar conta</a>
      </div>
    </header>

    <main class="section">
      <div class="container" style="max-width: 520px;">
        <div class="card">
          <h2>Acesse sua área</h2>
          <p class="helper">Use seu e-mail Hotmart para entrar.</p>
          <form class="form" data-login-form>
            <label>
              E-mail
              <input type="email" id="login-email" required placeholder="voce@email.com" />
            </label>
            <label>
              Senha
              <input type="password" id="login-password" required placeholder="********" />
            </label>
            <p class="notice warning" data-message>Preencha seus dados para entrar.</p>
            <button class="btn btn-primary" type="submit">Entrar</button>
          </form>
          <p class="helper" style="margin-top: 16px;">
            Ainda não tem conta? <a href="register.html"><strong>Crie agora</strong></a>.
          </p>
        </div>
      </div>
    </main>

    <script src="assets/auth.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
