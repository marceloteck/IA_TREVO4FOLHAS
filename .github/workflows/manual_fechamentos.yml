name: Fechamentos Manual Test

on:
  workflow_dispatch:

jobs:
  fechamento-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/test_fechamentos_auto.py tests/test_fechamentos_posicionais.py
