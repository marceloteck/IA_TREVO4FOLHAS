name: Backtest Manual (Commit se tiver 13+)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Quantas horas rodar"
        required: true
        default: "5.0"
      block_size:
        description: "Tamanho do bloco"
        required: true
        default: "250"
      aggressive:
        description: "Modo agressivo"
        required: true
        default: "true"
      min_mem:
        description: "Salvar memoria a partir de (13 recomendado)"
        required: true
        default: "13"
      min_new_13:
        description: "Qtd mínima de novas memórias 13+ para permitir commit (evita spam)"
        required: true
        default: "10"
  # Adicionado Cron para rodar a cada 20 minutos
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start DB (schema + import CSV)
        run: |
          python START/startBD.py

      - name: Run backtest
        shell: bash
        run: |
          # Define valores padrão caso o disparador seja o Cron (onde inputs ficam vazios)
          HOURS="${{ github.event.inputs.hours || '5.0' }}"
          BLOCK="${{ github.event.inputs.block_size || '250' }}"
          AGG="${{ github.event.inputs.aggressive || 'true' }}"
          MIN_MEM="${{ github.event.inputs.min_mem || '13' }}"

          CMD="python -m training.backtest.backtest_engine --hours ${HOURS} --block-size ${BLOCK} --min-mem ${MIN_MEM}"
          if [ "${AGG}" = "true" ]; then
            CMD="${CMD} --aggressive"
          fi

          echo "Running: ${CMD}"
          ${CMD}

      - name: Commit somente se teve ganho 13+/14+/15
        env:
          # Fallback para o script de commit
          MIN_NEW_13: ${{ github.event.inputs.min_new_13 || '10' }}
        run: |
          python scripts/commit_if_good.py
